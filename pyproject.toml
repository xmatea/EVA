[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name='EVA'
python-requires='3.14'
version='2.4.1'
url=''
license= {text = 'MIT License'}
author='Aidy'
author_email='adrian.hillier@stfc.ac.uk'
description='Elemental analysis Data Visualiser for MuX @ ISIS'
test_suite = "Tests"
dependencies = ["PyQt6", "scipy", "numpy", "matplotlib", "lmfit", "pandas", "setuptools", "pyyaml", "h5py", "pysrim @ git+https://gitlab.com/costrouc/pysrim.git"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib"
]